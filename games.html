<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jabberr's Arcade & Games!</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .game-card {
            border: 2px dashed orange;
            background: #111;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 8px;
            max-width: 500px;
        }
        .ttt-board {
            display: grid;
            grid-template-columns: repeat(3, 60px);
            grid-gap: 5px;
            margin-top: 10px;
        }
        .ttt-cell {
            width: 60px;
            height: 60px;
            background: #222;
            border: 1px solid orange;
            font-size: 28px;
            font-weight: bold;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }
        .ttt-cell:hover {
            background: #333;
        }
    </style>
</head>
<body>

    <a href="index.html">Back&lt;--</a>
    <h1 style="font-family: 'Comic Sans MS', cursive, sans-serif;">🕹️ Jabberr's Arcade & Games!</h1>
    <p>Take a break from chatting and play some games right here on the site!</p>

    <!-- GAME 1: TIC-TAC-TOE -->
    <div class="game-card">
        <h3>❌ Tic-Tac-Toe (vs. AI)</h3>
        <p id="tttStatus">Your turn (X)</p>
        <div class="ttt-board" id="tttBoard">
            <div class="ttt-cell" onclick="makeMove(0)"></div>
            <div class="ttt-cell" onclick="makeMove(1)"></div>
            <div class="ttt-cell" onclick="makeMove(2)"></div>
            <div class="ttt-cell" onclick="makeMove(3)"></div>
            <div class="ttt-cell" onclick="makeMove(4)"></div>
            <div class="ttt-cell" onclick="makeMove(5)"></div>
            <div class="ttt-cell" onclick="makeMove(6)"></div>
            <div class="ttt-cell" onclick="makeMove(7)"></div>
            <div class="ttt-cell" onclick="makeMove(8)"></div>
        </div>
        <button style="margin-top: 10px;" onclick="resetTTT()">Restart Game</button>
    </div>

    <!-- GAME 2: ROCK PAPER SCISSORS -->
    <div class="game-card">
        <h3>✂️ Rock, Paper, Scissors</h3>
        <p>Choose your weapon:</p>
        <button onclick="playRPS('rock')">✊ Rock</button>
        <button onclick="playRPS('paper')">📄 Paper</button>
        <button onclick="playRPS('scissors')">✂️ Scissors</button>
        <p id="rpsResult" style="margin-top: 10px; font-weight: bold; color: orange;"></p>
    </div>

    <!-- GAME 3: NUMBER GUESSER -->
    <div class="game-card">
        <h3>🔢 Guess the Number (1 - 50)</h3>
        <p>I'm thinking of a number between 1 and 50. Can you guess it?</p>
        <input type="number" id="guessInput" min="1" max="50" placeholder="Enter number..." style="width: 120px;">
        <button onclick="checkGuess()">Guess!</button>
        <p id="guessResult" style="margin-top: 10px; font-style: italic;"></p>
    </div>

    <script>
        // --- TIC-TAC-TOE LOGIC ---
        let tttBoardState = ['', '', '', '', '', '', '', '', ''];
        let tttGameActive = true;

        function makeMove(index) {
            if (!tttGameActive || tttBoardState[index] !== '') return;
            
            tttBoardState[index] = 'X';
            renderTTT();

            if (checkWin('X')) {
                document.getElementById('tttStatus').textContent = '🎉 You win!';
                tttGameActive = false;
                return;
            }
            if (tttBoardState.every(cell => cell !== '')) {
                document.getElementById('tttStatus').textContent = "🤝 It's a draw!";
                tttGameActive = false;
                return;
            }

            document.getElementById('tttStatus').textContent = "AI's turn...";
            setTimeout(aiMove, 400);
        }

        function aiMove() {
            if (!tttGameActive) return;
            // Find empty spots
            let emptyIndices = [];
            tttBoardState.forEach((val, idx) => { if (val === '') emptyIndices.push(idx); });
            if (emptyIndices.length === 0) return;

            // Simple AI random move
            let randomIndex = emptyIndices[Math.floor(Math.random() * emptyIndices.length)];
            tttBoardState[randomIndex] = 'O';
            renderTTT();

            if (checkWin('O')) {
                document.getElementById('tttStatus').textContent = '🤖 AI wins! Try again.';
                tttGameActive = false;
                return;
            }
            if (tttBoardState.every(cell => cell !== '')) {
                document.getElementById('tttStatus').textContent = "🤝 It's a draw!";
                tttGameActive = false;
                return;
            }
            document.getElementById('tttStatus').textContent = 'Your turn (X)';
        }

        function checkWin(player) {
            const wins = [
                [0,1,2], [3,4,5], [6,7,8], // Rows
                [0,3,6], [1,4,7], [2,5,8], // Columns
                [0,4,8], [2,4,6]           // Diagonals
            ];
            return wins.some(combination => {
                return combination.every(index => tttBoardState[index] === player);
            });
        }

        function renderTTT() {
            const cells = document.querySelectorAll('.ttt-cell');
            cells.forEach((cell, idx) => {
                cell.textContent = tttBoardState[idx];
                cell.style.color = tttBoardState[idx] === 'X' ? '#00ffff' : '#ff00ff';
            });
        }

        function resetTTT() {
            tttBoardState = ['', '', '', '', '', '', '', '', ''];
            tttGameActive = true;
            document.getElementById('tttStatus').textContent = 'Your turn (X)';
            renderTTT();
        }

        // --- ROCK PAPER SCISSORS LOGIC ---
        function playRPS(playerChoice) {
            const choices = ['rock', 'paper', 'scissors'];
            const aiChoice = choices[Math.floor(Math.random() * choices.length)];
            
            let outcome = '';
            if (playerChoice === aiChoice) {
                outcome = `🤝 It's a tie! Both chose ${aiChoice}.`;
            } else if (
                (playerChoice === 'rock' && aiChoice === 'scissors') ||
                (playerChoice === 'paper' && aiChoice === 'rock') ||
                (playerChoice === 'scissors' && aiChoice === 'paper')
            ) {
                outcome = `🎉 You win! Computer chose ${aiChoice}.`;
            } else {
                outcome = `🤖 Computer wins! Computer chose ${aiChoice}.`;
            }
            document.getElementById('rpsResult').textContent = outcome;
        }

        // --- NUMBER GUESSER LOGIC ---
        let targetNumber = Math.floor(Math.random() * 50) + 1;
        function checkGuess() {
            const userGuess = parseInt(document.getElementById('guessInput').value);
            const resultEl = document.getElementById('guessResult');

            if (!userGuess || userGuess < 1 || userGuess > 50) {
                resultEl.textContent = '⚠️ Please enter a valid number between 1 and 50.';
                return;
            }

            if (userGuess === targetNumber) {
                resultEl.textContent = `🎉 Correct! The number was ${targetNumber}. A new number has been generated!`;
                targetNumber = Math.floor(Math.random() * 50) + 1;
            } else if (userGuess < targetNumber) {
                resultEl.textContent = '📈 Too low! Try a higher number.';
            } else {
                resultEl.textContent = '📉 Too high! Try a lower number.';
            }
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jabberrs Awesome Chat App!!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="index.html">Back&lt;--</a>
    <h1 style="font-family: 'Comic Sans MS', cursive, sans-serif;">Jabberrs Awesome Chat App!!</h1>

    <div id="login-section" style="display: none;">
        <p>You need to log in to chat.</p>
        <a href="auth.html">Go to Login / Sign Up</a>
    </div>

    <div id="main-section">
        <p>Logged in as: <strong id="displayUsername"></strong> <button id="logoutBtn">Log Out</button></p>
        
        <div style="margin-bottom: 10px;">
            <a href="jabberrsstuff.html">Post Feed</a>
        </div>

        <!-- Room Switcher Tabs -->
        <div style="margin-bottom: 10px;">
            <button id="tabPublic" style="background: orange; font-weight: bold;" onclick="switchTab('public')">🌐 Public Chat Room</button>
            <button id="tabDM" onclick="switchTab('dm')">💬 Private DMs</button>
        </div>

        <!-- PUBLIC CHAT VIEW -->
        <div id="publicChatView">
            <h2>Public Chat Room</h2>
            <div id="chatBox" style="border: 2px solid orange; background: #111; height: 350px; overflow-y: auto; padding: 10px; margin-bottom: 10px; font-family: monospace;"></div>

            <form id="chatForm">
                <input type="text" id="chatInput" placeholder="Type a public message or use /ban [username]..." style="width: 400px; max-width: 100%;" required>
                <input type="file" id="chatFileInput">
                <button type="submit">Send Public</button>
            </form>
        </div>

        <!-- DIRECT MESSAGE (DM) VIEW -->
        <div id="dmView" style="display: none;">
            <h2>Private Direct Messages</h2>
            <div style="margin-bottom: 5px;">
                <label for="dmRecipient">Whispering to:</label>
                <select id="dmRecipient" style="padding: 3px;">
                    <option value="">-- Select online user --</option>
                </select>
            </div>
            
            <div id="dmBox" style="border: 2px solid cyan; background: #111; height: 350px; overflow-y: auto; padding: 10px; margin-bottom: 10px; font-family: monospace;"></div>

            <form id="dmForm">
                <input type="text" id="dmInput" placeholder="Type a private whisper..." style="width: 400px; max-width: 100%;" required>
                <button type="submit">Send DM</button>
            </form>
        </div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let username = localStorage.getItem('jabber_username') || '';

        const mainSection = document.getElementById('main-section');
        const loginSection = document.getElementById('login-section');
        const displayUsername = document.getElementById('displayUsername');
        const logoutBtn = document.getElementById('logoutBtn');

        // Views & Tabs
        const publicChatView = document.getElementById('publicChatView');
        const dmView = document.getElementById('dmView');
        const tabPublic = document.getElementById('tabPublic');
        const tabDM = document.getElementById('tabDM');

        // Public Chat Elements
        const chatBox = document.getElementById('chatBox');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const chatFileInput = document.getElementById('chatFileInput');

        // DM Elements
        const dmBox = document.getElementById('dmBox');
        const dmForm = document.getElementById('dmForm');
        const dmInput = document.getElementById('dmInput');
        const dmRecipient = document.getElementById('dmRecipient');

        let onlineUsersList = [];
        let dmConversations = {}; // stores history per user partner

        if (!username) {
            loginSection.style.display = 'block';
            mainSection.style.display = 'none';
        } else {
            displayUsername.textContent = username;
            socket.emit('register_user', username);
        }

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('jabber_username');
            window.location.href = 'auth.html';
        });

        // Tab Switching Logic
        function switchTab(tab) {
            if (tab === 'public') {
                publicChatView.style.display = 'block';
                dmView.style.display = 'none';
                tabPublic.style.background = 'orange';
                tabDM.style.background = '';
            } else {
                publicChatView.style.display = 'none';
                dmView.style.display = 'block';
                tabDM.style.background = 'cyan';
                tabPublic.style.background = '';
                updateDMRecipientDropdown();
            }
        }

        // Socket Listeners for Public Chat
        socket.on('init_history', (data) => {
            chatBox.innerHTML = '';
            data.messages.forEach(msg => appendPublicMessage(msg));
        });

        socket.on('chat_message', (msg) => {
            appendPublicMessage(msg);
        });

        socket.on('update_user_list', (users) => {
            onlineUsersList = users.filter(u => u !== username);
            updateDMRecipientDropdown();
        });

        // Admin ban/kick events
        socket.on('force_disconnect', (reason) => {
            alert(reason);
            localStorage.removeItem('jabber_username');
            window.location.href = 'auth.html';
        });

        socket.on('force_ban', (msg) => {
            alert(msg);
            localStorage.removeItem('jabber_username');
            window.location.href = 'banned.html';
        });

        socket.on('clear_chat', () => {
            chatBox.innerHTML = '';
        });

        // Submit Public Message
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInput.value;
            const file = chatFileInput.files[0];

            if (!text.trim() && !file) return;

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    socket.emit('chat_message', { 
                        username, 
                        text, 
                        file: { name: file.name, type: file.type, data: event.target.result } 
                    });
                    chatInput.value = '';
                    chatFileInput.value = '';
                };
                reader.readAsDataURL(file);
            } else {
                socket.emit('chat_message', { username, text, file: null });
                chatInput.value = '';
            }
        });

        function appendPublicMessage(msg) {
            const div = document.createElement('div');
            div.style.marginBottom = '5px';
            
            if (msg.type === 'system') {
                div.style.color = '#ffaa00';
                div.innerHTML = `<em>[${msg.timestamp}] ${escapeHTML(msg.text)}</em>`;
            } else {
                let fileHTML = '';
                if (msg.file) {
                    if (msg.file.type.startsWith('image/')) {
                        fileHTML = `<br><img src="${msg.file.data}" alt="${escapeHTML(msg.file.name)}" style="max-width: 200px; display: block; margin-top: 5px;">`;
                    } else {
                        fileHTML = `<br><a href="${msg.file.data}" download="${escapeHTML(msg.file.name)}">📎 Download ${escapeHTML(msg.file.name)}</a>`;
                    }
                }
                div.innerHTML = `<span style="color: #888;">[${msg.timestamp}]</span> <strong style="color: #ff7700;">${escapeHTML(msg.username)}:</strong> ${escapeHTML(msg.text)}${fileHTML}`;
            }
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // Direct Message (DM) Handling
        function updateDMRecipientDropdown() {
            const currentSelected = dmRecipient.value;
            dmRecipient.innerHTML = '<option value="">-- Select online user --</option>';
            onlineUsersList.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u;
                opt.textContent = u;
                if (u === currentSelected) opt.selected = true;
                dmRecipient.appendChild(opt);
            });
        }

        dmRecipient.addEventListener('change', () => {
            renderDMBox();
        });

        dmForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const recipient = dmRecipient.value;
            const text = dmInput.value.trim();

            if (!recipient) {
                alert('Please select a user to DM first!');
                return;
            }
            if (!text) return;

            socket.emit('private_message', {
                sender: username,
                recipient: recipient,
                text: text
            });

            dmInput.value = '';
        });

        socket.on('private_message', (data) => {
            const partner = (data.sender === username) ? data.recipient : data.sender;
            if (!dmConversations[partner]) {
                dmConversations[partner] = [];
            }
            dmConversations[partner].push(data);
            renderDMBox();
        });

        function renderDMBox() {
            const partner = dmRecipient.value;
            dmBox.innerHTML = '';
            if (!partner) {
                dmBox.innerHTML = '<em style="color: #666;">Select a recipient above to start chatting privately.</em>';
                return;
            }
            const history = dmConversations[partner] || [];
            if (history.length === 0) {
                dmBox.innerHTML = `<em style="color: #666;">No private messages with ${escapeHTML(partner)} yet. Say hello!</em>`;
                return;
            }

            history.forEach(msg => {
                const div = document.createElement('div');
                div.style.marginBottom = '5px';
                const isMe = msg.sender === username;
                const senderColor = isMe ? '#00ffff' : '#ff00ff';
                div.innerHTML = `<span style="color: #888;">[${msg.timestamp}]</span> <strong style="color: ${senderColor};">${escapeHTML(msg.sender)}:</strong> ${escapeHTML(msg.text)}`;
                dmBox.appendChild(div);
            });
            dmBox.scrollTop = dmBox.scrollHeight;
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>

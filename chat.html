<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat & DMs</title>
</head>
<body>

    <a href="index.html"><button>Back<--</button></a>

    <h1>Jabberrs Awesome Chat App!!</h1>

    <!-- Username Section -->
    <div id="login-section">
        <label for="usernameInput">Enter your username:</label>
        <input type="text" id="usernameInput" placeholder="Username...">
        <button id="joinBtn">Join Chat</button>
    </div>

    <!-- Chat Section (Hidden until username is set) -->
    <div id="chat-section" style="display: none;">
        <p>Logged in as: <strong id="displayUsername"></strong> <button id="changeNameBtn">Change</button></p>
        
        <!-- Online Users List -->
        <div>
            <strong>Online Users:</strong>
            <ul id="onlineUsersList"></ul>
        </div>

        <hr>

        <!-- Public Messages Container -->
        <h2>Public Chat Room</h2>
        <div id="chatBox" style="border: 1px solid black; height: 250px; overflow-y: scroll; margin-bottom: 10px; padding: 5px;"></div>

        <!-- Message Input Form -->
        <form id="chatForm">
            <input type="text" id="messageInput" placeholder="Type a public message or use @username..." autocomplete="off" required>
            <input type="file" id="fileInput">
            <button type="submit">Send Public</button>
        </form>

        <hr>

        <!-- Direct Messages Section -->
        <h2>Direct Messages (DMs)</h2>
        <p>Currently messaging: <strong id="currentDmTarget">Select a user from above</strong></p>
        <div id="dmBox" style="border: 1px solid black; height: 200px; overflow-y: scroll; margin-bottom: 10px; padding: 5px;"></div>

        <form id="dmForm">
            <input type="text" id="dmInput" placeholder="Type a private message..." autocomplete="off" required>
            <button type="submit" id="sendDmBtn" disabled>Send DM</button>
        </form>
    </div>

    <!-- Include Socket.io Client Script -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginSection = document.getElementById('login-section');
        const chatSection = document.getElementById('chat-section');
        const usernameInput = document.getElementById('usernameInput');
        const joinBtn = document.getElementById('joinBtn');
        const displayUsername = document.getElementById('displayUsername');
        const changeNameBtn = document.getElementById('changeNameBtn');
        const onlineUsersList = document.getElementById('onlineUsersList');
        
        const chatBox = document.getElementById('chatBox');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');

        const dmBox = document.getElementById('dmBox');
        const dmForm = document.getElementById('dmForm');
        const dmInput = document.getElementById('dmInput');
        const sendDmBtn = document.getElementById('sendDmBtn');
        const currentDmTarget = document.getElementById('currentDmTarget');

        let username = localStorage.getItem('jabber_username') || '';
        let selectedDmUser = '';

        if (username) {
            displayUsername.textContent = username;
            loginSection.style.display = 'none';
            chatSection.style.display = 'block';
            socket.emit('register_user', username);
        }

        if (window.Notification && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        joinBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (name) {
                username = name;
                localStorage.setItem('jabber_username', username);
                displayUsername.textContent = username;
                loginSection.style.display = 'none';
                chatSection.style.display = 'block';
                socket.emit('register_user', username);
            } else {
                alert('Please enter a valid username.');
            }
        });

        changeNameBtn.addEventListener('click', () => {
            loginSection.style.display = 'block';
            chatSection.style.display = 'none';
            usernameInput.value = username;
        });

        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinBtn.click();
        });

        // Update online users list
        socket.on('update_user_list', (users) => {
            onlineUsersList.innerHTML = '';
            users.forEach(user => {
                if (user !== username) {
                    const li = document.createElement('li');
                    li.innerHTML = `${escapeHTML(user)} <button onclick="selectDmUser('${escapeHTML(user)}')">Message DM</button>`;
                    onlineUsersList.appendChild(li);
                }
            });
        });

        window.selectDmUser = function(targetUser) {
            selectedDmUser = targetUser;
            currentDmTarget.textContent = targetUser;
            sendDmBtn.disabled = false;
            dmBox.innerHTML += `<p><small>--- Started DM conversation with ${escapeHTML(targetUser)} ---</small></p>`;
        };

        socket.on('init_history', (data) => {
            chatBox.innerHTML = '';
            data.messages.forEach(msg => appendMessage(msg, false));
        });

        socket.on('chat_message', (msg) => {
            appendMessage(msg, true);
        });

        // Receive Direct Message
        socket.on('private_message', (dm) => {
            // Only show if it involves the current user
            if (dm.sender === username || dm.recipient === username) {
                const dmElement = document.createElement('div');
                dmElement.innerHTML = `<strong>[DM - ${dm.timestamp}] ${escapeHTML(dm.sender)} to ${escapeHTML(dm.recipient)}:</strong> ${escapeHTML(dm.text)}`;
                dmBox.appendChild(dmElement);
                dmBox.scrollTop = dmBox.scrollHeight;

                if (dm.sender !== username) {
                    playBeep();
                    if (window.Notification && Notification.permission === "granted") {
                        new Notification(`New DM from ${dm.sender}`, { body: dm.text });
                    }
                }
            }
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value;
            const file = fileInput.files[0];

            if (!text.trim() && !file) return;

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    socket.emit('chat_message', {
                        username: username,
                        text: text,
                        file: {
                            name: file.name,
                            type: file.type,
                            data: event.target.result
                        }
                    });
                    messageInput.value = '';
                    fileInput.value = '';
                };
                reader.readAsDataURL(file);
            } else {
                socket.emit('chat_message', { username: username, text: text, file: null });
                messageInput.value = '';
            }
        });

        // Send Direct Message form handler
        dmForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = dmInput.value.trim();
            if (text && selectedDmUser) {
                socket.emit('private_message', {
                    sender: username,
                    recipient: selectedDmUser,
                    text: text
                });
                dmInput.value = '';
            }
        });

        function appendMessage(msg, isNew) {
            const messageElement = document.createElement('div');
            const isMentioned = username && msg.text.includes(`@${username}`);
            if (isMentioned) {
                messageElement.style.backgroundColor = '#ffff99';
            }

            let contentHTML = `<strong>[${msg.timestamp}] ${escapeHTML(msg.username)}:</strong> ${escapeHTML(msg.text)}`;

            if (msg.file) {
                if (msg.file.type.startsWith('image/')) {
                    contentHTML += `<br><img src="${msg.file.data}" alt="${escapeHTML(msg.file.name)}" style="max-width: 200px; display: block; margin-top: 5px;">`;
                } else {
                    contentHTML += `<br><a href="${msg.file.data}" download="${escapeHTML(msg.file.name)}">📎 Download ${escapeHTML(msg.file.name)}</a>`;
                }
            }

            messageElement.innerHTML = contentHTML;
            chatBox.appendChild(messageElement);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (isNew && msg.username !== username) {
                playBeep();
                if (isMentioned && window.Notification && Notification.permission === "granted") {
                    new Notification(`New mention from ${msg.username}`, { body: msg.text });
                }
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>

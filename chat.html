<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jabberrs Awesome Chat App!!</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Party mode animation styles */
        @keyframes partyColors {
            0% { background-color: #111; color: #ff0000; }
            20% { background-color: #220022; color: #00ff00; }
            40% { background-color: #002222; color: #00ffff; }
            60% { background-color: #222200; color: #ff00ff; }
            80% { background-color: #220000; color: #ffff00; }
            100% { background-color: #111; color: #ff7700; }
        }
        .party-mode {
            animation: partyColors 4s infinite;
        }
    </style>
</head>
<body id="pageBody">

    <a href="index.html">Back&lt;--</a>
    <h1 style="font-family: 'Comic Sans MS', cursive, sans-serif;">Jabberrs Awesome Chat App!!</h1>

    <div id="login-section" style="display: none;">
        <p>You need to log in to chat.</p>
        <a href="auth.html">Go to Login / Sign Up</a>
    </div>

    <div id="main-section">
        <p>Logged in as: <strong id="displayUsername"></strong> <span id="adminBadgeIndicator" style="display:none; background: red; color: white; padding: 1px 4px; font-size: 10px; border-radius: 3px; font-weight: bold;">[ADMIN]</span> <button id="logoutBtn">Log Out</button></p>
        
        <div style="margin-bottom: 10px;">
            <a href="jabberrsstuff.html">Post Feed</a> | <a href="games.html">🕹️ Arcade & Games</a>
        </div>

        <!-- Theme & Party Mode Toggles -->
        <div style="margin-bottom: 10px;">
            <button onclick="togglePartyMode()" style="background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet); color: white; font-weight: bold; border: 1px solid #fff; cursor: pointer;">🎉 Toggle Party Mode</button>
            <button onclick="setTheme('dark')" style="background: #222; color: #fff;">Dark Theme</button>
            <button onclick="setTheme('light')" style="background: #eee; color: #000;">Light Theme</button>
        </div>

        <!-- Room Switcher Tabs -->
        <div style="margin-bottom: 10px;">
            <button id="tabPublic" style="background: orange; font-weight: bold;" onclick="switchTab('public')">🌐 Public Chat Room</button>
            <button id="tabDM" onclick="switchTab('dm')">💬 Private DMs</button>
        </div>

        <!-- PUBLIC CHAT VIEW -->
        <div id="publicChatView">
            <h2>Public Chat Room</h2>
            <div id="chatBox" style="border: 2px solid orange; background: #111; height: 350px; overflow-y: auto; padding: 10px; margin-bottom: 5px; font-family: monospace;"></div>

            <!-- Typing Indicator Display -->
            <div id="typingIndicator" style="height: 20px; font-style: italic; color: #aaa; font-size: 13px; margin-bottom: 5px;"></div>

            <form id="chatForm">
                <input type="text" id="chatInput" placeholder="Type a public message..." style="width: 400px; max-width: 100%;" required>
                <input type="file" id="chatFileInput">
                <button type="submit">Send Public</button>
            </form>
        </div>

        <!-- DIRECT MESSAGE (DM) VIEW -->
        <div id="dmView" style="display: none;">
            <h2>Private Direct Messages</h2>
            <div style="margin-bottom: 5px;">
                <label for="dmRecipient">Whispering to:</label>
                <select id="dmRecipient" style="padding: 3px;">
                    <option value="">-- Select online user --</option>
                </select>
            </div>
            
            <div id="dmBox" style="border: 2px solid cyan; background: #111; height: 350px; overflow-y: auto; padding: 10px; margin-bottom: 10px; font-family: monospace;"></div>

            <form id="dmForm">
                <input type="text" id="dmInput" placeholder="Type a private whisper..." style="width: 400px; max-width: 100%;" required>
                <input type="file" id="dmFileInput">
                <button type="submit">Send DM</button>
            </form>
        </div>
    </div>

    <!-- AUDIO ELEMENTS -->
    <audio id="soundJoined" src="Joined.mp3" preload="auto"></audio>
    <audio id="soundLeft" src="Left.mp3" preload="auto"></audio>
    <audio id="soundMessage" src="Message.mp3" preload="auto"></audio>
    <audio id="soundSent" src="Sent.mp3" preload="auto"></audio>
    <audio id="soundParty" src="music.html" preload="auto"></audio> <!-- Optional background music helper if used -->

    <script src="/socket.io/socket.io.js"></script>
    <script>
        function playSound(type) {
            let audioEl = null;
            if (type === 'joined') audioEl = document.getElementById('soundJoined');
            else if (type === 'left') audioEl = document.getElementById('soundLeft');
            else if (type === 'message') audioEl = document.getElementById('soundMessage');
            else if (type === 'sent') audioEl = document.getElementById('soundSent');

            if (audioEl) {
                audioEl.currentTime = 0; 
                audioEl.play().catch(e => console.log('Audio autoplay blocked or file missing:', e));
            }
        }

        // Party mode toggle handler
        let isPartyActive = false;
        function togglePartyMode() {
            isPartyActive = !isPartyActive;
            const body = document.getElementById('pageBody');
            if (isPartyActive) {
                body.classList.add('party-mode');
            } else {
                body.classList.remove('party-mode');
            }
        }

        function setTheme(theme) {
            if (theme === 'light') {
                document.body.style.background = '#ffffff';
                document.body.style.color = '#000000';
            } else {
                document.body.style.background = '#121212';
                document.body.style.color = '#ffffff';
            }
        }

        const socket = io();
        let username = localStorage.getItem('jabber_username') || '';
        let isCurrentUserAdmin = false;

        const mainSection = document.getElementById('main-section');
        const loginSection = document.getElementById('login-section');
        const displayUsername = document.getElementById('displayUsername');
        const adminBadgeIndicator = document.getElementById('adminBadgeIndicator');
        const logoutBtn = document.getElementById('logoutBtn');

        const publicChatView = document.getElementById('publicChatView');
        const dmView = document.getElementById('dmView');
        const tabPublic = document.getElementById('tabPublic');
        const tabDM = document.getElementById('tabDM');

        const chatBox = document.getElementById('chatBox');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const chatFileInput = document.getElementById('chatFileInput');
        const typingIndicator = document.getElementById('typingIndicator');

        const dmBox = document.getElementById('dmBox');
        const dmForm = document.getElementById('dmForm');
        const dmInput = document.getElementById('dmInput');
        const dmFileInput = document.getElementById('dmFileInput');
        const dmRecipient = document.getElementById('dmRecipient');

        let onlineUsersList = [];
        let dmConversations = JSON.parse(localStorage.getItem('jabber_dm_history') || '{}');
        let publicMessagesList = [];
        let typingTimeout = null;

        if (!username) {
            loginSection.style.display = 'block';
            mainSection.style.display = 'none';
        } else {
            displayUsername.textContent = username;
            socket.emit('register_user', username);
        }

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('jabber_username');
            window.location.href = 'auth.html';
        });

        function switchTab(tab) {
            if (tab === 'public') {
                publicChatView.style.display = 'block';
                dmView.style.display = 'none';
                tabPublic.style.background = 'orange';
                tabDM.style.background = '';
            } else {
                publicChatView.style.display = 'none';
                dmView.style.display = 'block';
                tabDM.style.background = 'cyan';
                tabPublic.style.background = '';
                updateDMRecipientDropdown();
            }
        }

        socket.on('init_history', (data) => {
            publicMessagesList = data.messages || [];
            renderPublicChat();
        });

        socket.on('chat_message', (msg) => {
            publicMessagesList.push(msg);
            renderPublicChat();

            const isSelf = msg.username === username;
            if (msg.type === 'system') {
                if (msg.text.includes('joined')) playSound('joined');
                else if (msg.text.includes('left')) playSound('left');
            } else if (isSelf) {
                playSound('sent');
            } else {
                playSound('message');
            }
        });

        socket.on('update_public_messages', (messages) => {
            publicMessagesList = messages;
            renderPublicChat();
        });

        socket.on('update_user_list', (users) => {
            onlineUsersList = users.filter(u => u.username !== username);
            const currentMe = users.find(u => u.username === username);
            if (currentMe && currentMe.isAdmin) {
                isCurrentUserAdmin = true;
                adminBadgeIndicator.style.display = 'inline-block';
            }
            updateDMRecipientDropdown();
        });

        socket.on('force_disconnect', (reason) => {
            alert(reason);
            localStorage.removeItem('jabber_username');
            window.location.href = 'auth.html';
        });

        socket.on('force_ban', (msg) => {
            alert(msg);
            localStorage.removeItem('jabber_username');
            window.location.href = 'banned.html';
        });

        socket.on('clear_chat', () => {
            publicMessagesList = [];
            renderPublicChat();
        });

        chatInput.addEventListener('input', () => {
            socket.emit('typing', { username: username });
            clearTimeout(typingTimeout);
            typingTimeout = setTimeout(() => {
                socket.emit('typing', { username: '' });
            }, 1500);
        });

        let typingClearTimer = null;
        socket.on('display_typing', (data) => {
            if (data.username && data.username !== username) {
                typingIndicator.textContent = `${data.username} is typing...`;
                clearTimeout(typingClearTimer);
                typingClearTimer = setTimeout(() => {
                    typingIndicator.textContent = '';
                }, 2000);
            } else if (!data.username) {
                typingIndicator.textContent = '';
            }
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInput.value.trim();
            const file = chatFileInput.files[0];

            if (!text && !file) return;
            socket.emit('typing', { username: '' });

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    socket.emit('chat_message', { 
                        username, 
                        text, 
                        file: { name: file.name, type: file.type, data: event.target.result } 
                    });
                    chatInput.value = '';
                    chatFileInput.value = '';
                };
                reader.readAsDataURL(file);
            } else {
                socket.emit('chat_message', { username, text, file: null });
                chatInput.value = '';
            }
        });

        function renderPublicChat() {
            chatBox.innerHTML = '';
            publicMessagesList.forEach((msg, index) => {
                const div = document.createElement('div');
                div.style.marginBottom = '5px';
                
                if (msg.type === 'system') {
                    div.style.color = '#ffaa00';
                    div.innerHTML = `<em>[${msg.timestamp}] ${escapeHTML(msg.text)}</em>`;
                } else {
                    let fileHTML = '';
                    if (msg.file) {
                        const fType = msg.file.type;
                        const fData = msg.file.data;
                        const fName = escapeHTML(msg.file.name);
                        
                        if (fType.startsWith('image/')) {
                            fileHTML = `<br><img src="${fData}" alt="${fName}" style="max-width: 250px; display: block; margin-top: 5px; border-radius: 4px;">
                                        <br><a href="${fData}" download="${fName}" style="background: #333; color: orange; padding: 2px 8px; text-decoration: none; border: 1px solid orange; font-size: 11px; border-radius: 3px;">💾 Download ${fName}</a>`;
                        } else if (fType.startsWith('video/')) {
                            fileHTML = `<br><video controls style="max-width: 300px; display: block; margin-top: 5px;"><source src="${fData}" type="${fType}">Your browser does not support video.</video>
                                        <br><a href="${fData}" download="${fName}" style="background: #333; color: orange; padding: 2px 8px; text-decoration: none; border: 1px solid orange; font-size: 11px; border-radius: 3px;">💾 Download ${fName}</a>`;
                        } else if (fType.startsWith('audio/')) {
                            fileHTML = `<br><audio controls style="margin-top: 5px;"><source src="${fData}" type="${fType}"></audio>
                                        <br><a href="${fData}" download="${fName}" style="background: #333; color: orange; padding: 2px 8px; text-decoration: none; border: 1px solid orange; font-size: 11px; border-radius: 3px;">💾 Download ${fName}</a>`;
                        } else {
                            fileHTML = `<br><a href="${fData}" download="${fName}" style="background: #333; color: orange; padding: 2px 8px; text-decoration: none; border: 1px solid orange; font-size: 11px; border-radius: 3px;">💾 Download ${fName}</a>`;
                        }
                    }

                    const adminBadge = msg.isAdmin ? ` <span style="background: red; color: white; padding: 1px 4px; font-size: 10px; border-radius: 3px; font-weight: bold;">[ADMIN]</span>` : '';
                    
                    let actionButtons = '';
                    if (msg.username === username || isCurrentUserAdmin) {
                        actionButtons = ` <span style="margin-left: 10px;">
                            <button onclick="editPublicMessage(${index})" style="background: #444; color: #ffaa00; border: 1px solid #ffaa00; font-size: 10px; cursor: pointer; border-radius: 3px;">Edit</button>
                            <button onclick="deletePublicMessage(${index})" style="background: #444; color: #ff5555; border: 1px solid #ff5555; font-size: 10px; cursor: pointer; border-radius: 3px;">Delete</button>
                        </span>`;
                    }

                    div.innerHTML = `<span style="color: #888;">[${msg.timestamp}]</span> <strong style="color: #ff7700;">${escapeHTML(msg.username)}</strong>${adminBadge}: <span id="pub-msg-text-${index}">${formatLinks(escapeHTML(msg.text))}</span>${fileHTML}${actionButtons}`;
                }
                chatBox.appendChild(div);
            });
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function deletePublicMessage(index) {
            if (confirm("Are you sure you want to delete this message?")) {
                socket.emit('delete_public_message', { index, username, isAdmin: isCurrentUserAdmin });
            }
        }

        function editPublicMessage(index) {
            const msg = publicMessagesList[index];
            const newText = prompt("Edit your message:", msg.text);
            if (newText !== null && newText.trim() !== "") {
                socket.emit('edit_public_message', { index, newText: newText.trim(), username, isAdmin: isCurrentUserAdmin });
            }
        }

        function updateDMRecipientDropdown() {
            const currentSelected = dmRecipient.value;
            dmRecipient.innerHTML = '<option value="">-- Select online user --</option>';
            onlineUsersList.forEach(u => {
                const opt = document.createElement('option');
                opt.value = u.username;
                opt.textContent = u.username + (u.isAdmin ? ' [ADMIN]' : '');
                if (u.username === currentSelected) opt.selected = true;
                dmRecipient.appendChild(opt);
            });
        }

        dmRecipient.addEventListener('change', () => {
            renderDMBox();
        });

        dmForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const recipient = dmRecipient.value;
            const text = dmInput.value.trim();
            const file = dmFileInput.files[0];

            if (!recipient) {
                alert('Please select a user to DM first!');
                return;
            }
            if (!text && !file) return;

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    socket.emit('private_message', {
                        sender: username,
                        recipient: recipient,
                        text: text,
                        file: { name: file.name, type: file.type, data: event.target.result }
                    });
                    dmInput.value = '';
                    dmFileInput.value = '';
                };
                reader.readAsDataURL(file);
            } else {
                socket.emit('private_message', {
                    sender: username,
                    recipient: recipient,
                    text: text,
                    file: null
                });
                dmInput.value = '';
            }
        });

        socket.on('private_message', (data) => {
            const partner = (data.sender === username) ? data.recipient : data.sender;
            if (!dmConversations[partner]) {
                dmConversations[partner] = [];
            }
            dmConversations[partner].push(data);
            localStorage.setItem('jabber_dm_history', JSON.stringify(dmConversations));
            renderDMBox();
            
            if (data.sender === username) playSound('sent');
            else playSound('message');
        });

        function renderDMBox() {
            const partner = dmRecipient.value;
            dmBox.innerHTML = '';
            if (!partner) {
                dmBox.innerHTML = '<em style="color: #666;">Select a recipient above to start chatting privately.</em>';
                return;
            }
            const history = dmConversations[partner] || [];
            if (history.length === 0) {
                dmBox.innerHTML = `<em style="color: #666;">No private messages with ${escapeHTML(partner)} yet. Say hello!</em>`;
                return;
            }

            history.forEach((msg, index) => {
                const div = document.createElement('div');
                div.style.marginBottom = '5px';
                const isMe = msg.sender === username;
                const senderColor = isMe ? '#00ffff' : '#ff00ff';

                let fileHTML = '';
                if (msg.file) {
                    const fType = msg.file.type;
                    const fData = msg.file.data;
                    const fName = escapeHTML(msg.file.name);
                    
                    if (fType.startsWith('image/')) {
                        fileHTML = `<br><img src="${fData}" alt="${fName}" style="max-width: 250px; display: block; margin-top: 5px; border-radius: 4px;">
                                    <br><a href="${fData}" download="${fName}" style="background: #333; color: cyan; padding: 2px 8px; text-decoration: none; border: 1px solid cyan; font-size: 11px; border-radius: 3px;">💾 Download ${fName}</a>`;
                    } else if (fType.startsWith('video/')) {
                        fileHTML = `<br><video controls style="max-width: 300px; display: block; margin-top: 5px;"><source src="${fData}" type="${fType}">Your browser does not support video.</video>
                                    <br><a href="${fData}" download="${fName}" style="background: #333; color: cyan; padding: 2px 8px; text-decoration: none; border: 1px solid cyan; font-size: 11px; border-radius: 3px;">💾 Download ${fName}</a>`;
                    } else if (fType.startsWith('audio/')) {
                        fileHTML = `<br><audio controls style="margin-top: 5px;"><source src="${fData}" type="${fType}"></audio>
                                    <br><a href="${fData}" download="${fName}" style="background: #333; color: cyan; padding: 2px 8px; text-decoration: none; border: 1px solid cyan; font-size: 11px; border-radius: 3px;">💾 Download ${fName}</a>`;
                    } else {
                        fileHTML = `<br><a href="${fData}" download="${fName}" style="background: #333; color: cyan; padding: 2px 8px; text-decoration: none; border: 1px solid cyan; font-size: 11px; border-radius: 3px;">💾 Download ${fName}</a>`;
                    }
                }

                let dmActionButtons = '';
                if (msg.sender === username || isCurrentUserAdmin) {
                    dmActionButtons = ` <span style="margin-left: 10px;">
                        <button onclick="editDM('${partner}', ${index})" style="background: #444; color: #00ffff; border: 1px solid #00ffff; font-size: 10px; cursor: pointer; border-radius: 3px;">Edit</button>
                        <button onclick="deleteDM('${partner}', ${index})" style="background: #444; color: #ff5555; border: 1px solid #ff5555; font-size: 10px; cursor: pointer; border-radius: 3px;">Delete</button>
                    </span>`;
                }

                div.innerHTML = `<span style="color: #888;">[${msg.timestamp}]</span> <strong style="color: ${senderColor};">${escapeHTML(msg.sender)}:</strong> ${formatLinks(escapeHTML(msg.text))}${fileHTML}${dmActionButtons}`;
                dmBox.appendChild(div);
            });
            dmBox.scrollTop = dmBox.scrollHeight;
        }

        function deleteDM(partner, index) {
            if (confirm("Delete this DM?")) {
                if (dmConversations[partner]) {
                    dmConversations[partner].splice(index, 1);
                    localStorage.setItem('jabber_dm_history', JSON.stringify(dmConversations));
                    renderDMBox();
                }
            }
        }

        function editDM(partner, index) {
            const msg = dmConversations[partner][index];
            const newText = prompt("Edit your private message:", msg.text);
            if (newText !== null && newText.trim() !== "") {
                msg.text = newText.trim();
                localStorage.setItem('jabber_dm_history', JSON.stringify(dmConversations));
                renderDMBox();
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }

        function formatLinks(text) {
            const urlRegex = /(https?:\/\/[^\s]+)/g;
            return text.replace(urlRegex, function(url) {
                return `<a href="${url}" target="_blank" style="color: #00aced; text-decoration: underline;">${url}</a>`;
            });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jabberrs Awesome Chat App!!</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="index.html">Back&lt;--</a>
    <h1 style="font-family: 'Comic Sans MS', cursive, sans-serif;">Jabberrs Awesome Chat App!!</h1>

    <div id="login-section" style="display: none;">
        <p>You need to log in to chat.</p>
        <a href="auth.html">Go to Login / Sign Up</a>
    </div>

    <div id="main-section">
        <p>Logged in as: <strong id="displayUsername"></strong> <button id="logoutBtn">Log Out</button></p>
        
        <div style="margin-bottom: 10px;">
            <a href="chat.html">Public Chat Room</a> | <a href="dm.html">Direct Messages (DMs)</a>
        </div>

        <h2>Public Chat Room</h2>
        
        <!-- Chat Box Feed -->
        <div id="chatBox" style="border: 2px solid orange; background: #111; height: 400px; overflow-y: auto; padding: 10px; margin-bottom: 10px; font-family: monospace;"></div>

        <!-- Chat Input Form -->
        <form id="chatForm">
            <input type="text" id="chatInput" placeholder="Type a public message or use @username..." style="width: 400px; max-width: 100%;" required>
            <input type="file" id="chatFileInput">
            <button type="submit">Send Public</button>
        </form>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let username = localStorage.getItem('jabber_username') || '';

        const mainSection = document.getElementById('main-section');
        const loginSection = document.getElementById('login-section');
        const displayUsername = document.getElementById('displayUsername');
        const logoutBtn = document.getElementById('logoutBtn');
        const chatBox = document.getElementById('chatBox');
        const chatForm = document.getElementById('chatForm');
        const chatInput = document.getElementById('chatInput');
        const chatFileInput = document.getElementById('chatFileInput');

        if (!username) {
            loginSection.style.display = 'block';
            mainSection.style.display = 'none';
        } else {
            displayUsername.textContent = username;
            socket.emit('register_user', username);
        }

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('jabber_username');
            window.location.href = 'auth.html';
        });

        // Listen for history and incoming messages
        socket.on('init_history', (data) => {
            chatBox.innerHTML = '';
            data.messages.forEach(msg => appendMessage(msg));
        });

        socket.on('chat_message', (msg) => {
            appendMessage(msg);
        });

        // Admin Commands Handlers
        socket.on('force_disconnect', (reason) => {
            alert(reason);
            localStorage.removeItem('jabber_username');
            window.location.href = 'auth.html';
        });

        socket.on('banned_error', (msg) => {
            alert(msg);
            localStorage.removeItem('jabber_username');
            window.location.href = 'auth.html';
        });

        socket.on('clear_chat', () => {
            chatBox.innerHTML = '';
        });

        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = chatInput.value;
            const file = chatFileInput.files[0];

            if (!text.trim() && !file) return;

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    socket.emit('chat_message', { 
                        username, 
                        text, 
                        file: { name: file.name, type: file.type, data: event.target.result } 
                    });
                    chatInput.value = '';
                    chatFileInput.value = '';
                };
                reader.readAsDataURL(file);
            } else {
                socket.emit('chat_message', { username, text, file: null });
                chatInput.value = '';
            }
        });

        function appendMessage(msg) {
            const div = document.createElement('div');
            div.style.marginBottom = '5px';
            
            if (msg.type === 'system') {
                div.style.color = '#ffaa00';
                div.innerHTML = `<em>[${msg.timestamp}] ${escapeHTML(msg.text)}</em>`;
            } else {
                let fileHTML = '';
                if (msg.file) {
                    if (msg.file.type.startsWith('image/')) {
                        fileHTML = `<br><img src="${msg.file.data}" alt="${escapeHTML(msg.file.name)}" style="max-width: 200px; display: block; margin-top: 5px;">`;
                    } else {
                        fileHTML = `<br><a href="${msg.file.data}" download="${escapeHTML(msg.file.name)}">📎 Download ${escapeHTML(msg.file.name)}</a>`;
                    }
                }
                div.innerHTML = `<span style="color: #888;">[${msg.timestamp}]</span> <strong style="color: #ff7700;">${escapeHTML(msg.username)}:</strong> ${escapeHTML(msg.text)}${fileHTML}`;
            }
            
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>

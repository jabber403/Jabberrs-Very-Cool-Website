<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Chat</title>
</head>
<body>

    <a href="index.html"><button>Back<--</button></a>

    <h1>Jabberrs Awesome Chat App!!</h1>

    <!-- Username Section -->
    <div id="login-section">
        <label for="usernameInput">Enter your username:</label>
        <input type="text" id="usernameInput" placeholder="Username...">
        <button id="joinBtn">Join Chat</button>
    </div>

    <!-- Chat Section (Hidden until username is set) -->
    <div id="chat-section" style="display: none;">
        <p>Logged in as: <strong id="displayUsername"></strong> <button id="changeNameBtn">Change</button></p>
        
        <!-- Messages Container -->
        <div id="chatBox" style="border: 1px solid black; height: 300px; overflow-y: scroll; margin-bottom: 10px; padding: 5px;"></div>

        <!-- Message Input Form -->
        <form id="chatForm">
            <input type="text" id="messageInput" placeholder="Type a message or use @username..." autocomplete="off" autofocus required>
            <input type="file" id="fileInput">
            <button type="submit">Send</button>
        </form>
    </div>

    <!-- Include Socket.io Client Script -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginSection = document.getElementById('login-section');
        const chatSection = document.getElementById('chat-section');
        const usernameInput = document.getElementById('usernameInput');
        const joinBtn = document.getElementById('joinBtn');
        const displayUsername = document.getElementById('displayUsername');
        const changeNameBtn = document.getElementById('changeNameBtn');
        
        const chatBox = document.getElementById('chatBox');
        const chatForm = document.getElementById('chatForm');
        const messageInput = document.getElementById('messageInput');
        const fileInput = document.getElementById('fileInput');

        let username = localStorage.getItem('jabber_username') || '';

        if (username) {
            displayUsername.textContent = username;
            loginSection.style.display = 'none';
            chatSection.style.display = 'block';
        }

        // Request browser notification permissions on load
        if (window.Notification && Notification.permission !== "granted") {
            Notification.requestPermission();
        }

        // Simple audio beep generator using Web Audio API
        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.15);
            } catch (e) {}
        }

        // Handle joining chat
        joinBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (name) {
                username = name;
                localStorage.setItem('jabber_username', username);
                displayUsername.textContent = username;
                loginSection.style.display = 'none';
                chatSection.style.display = 'block';
            } else {
                alert('Please enter a valid username.');
            }
        });

        changeNameBtn.addEventListener('click', () => {
            loginSection.style.display = 'block';
            chatSection.style.display = 'none';
            usernameInput.value = username;
        });

        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinBtn.click();
        });

        // Receive past message history upon connection
        socket.on('init_history', (data) => {
            chatBox.innerHTML = '';
            data.messages.forEach(msg => appendMessage(msg, false));
        });

        // Receive new incoming messages
        socket.on('chat_message', (msg) => {
            appendMessage(msg, true);
        });

        // Handle sending messages and files
        chatForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = messageInput.value;
            const file = fileInput.files[0];

            if (!text.trim() && !file) return;

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    socket.emit('chat_message', {
                        username: username,
                        text: text,
                        file: {
                            name: file.name,
                            type: file.type,
                            data: event.target.result
                        }
                    });
                    messageInput.value = '';
                    fileInput.value = '';
                };
                reader.readAsDataURL(file);
            } else {
                socket.emit('chat_message', { username: username, text: text, file: null });
                messageInput.value = '';
            }
        });

        // Helper function to append a message to the chat box
        function appendMessage(msg, isNew) {
            const messageElement = document.createElement('div');
            
            const isMentioned = username && msg.text.includes(`@${username}`);
            if (isMentioned) {
                messageElement.style.backgroundColor = '#ffff99';
            }

            let contentHTML = `<strong>[${msg.timestamp}] ${escapeHTML(msg.username)}:</strong> ${escapeHTML(msg.text)}`;

            if (msg.file) {
                if (msg.file.type.startsWith('image/')) {
                    contentHTML += `<br><img src="${msg.file.data}" alt="${escapeHTML(msg.file.name)}" style="max-width: 200px; display: block; margin-top: 5px;">`;
                } else {
                    contentHTML += `<br><a href="${msg.file.data}" download="${escapeHTML(msg.file.name)}">📎 Download ${escapeHTML(msg.file.name)}</a>`;
                }
            }

            messageElement.innerHTML = contentHTML;
            chatBox.appendChild(messageElement);
            chatBox.scrollTop = chatBox.scrollHeight;

            if (isNew && msg.username !== username) {
                playBeep();
                if (isMentioned && window.Notification && Notification.permission === "granted") {
                    new Notification(`New mention from ${msg.username}`, { body: msg.text });
                }
            }
        }

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>

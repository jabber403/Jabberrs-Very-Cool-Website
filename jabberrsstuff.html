<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Feed</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <a href="index.html">Back&lt;--</a>
    <h1 style="font-family: 'Comic Sans MS', cursive, sans-serif;">Post Feed</h1>

    <div id="login-section">
        <p>You need to log in to post or interact.</p>
        <a href="auth.html">Go to Login / Sign Up</a>
    </div>

    <div id="main-section" style="display: none;">
        <p>Logged in as: <strong id="displayUsername"></strong> <button id="logoutBtn">Log Out</button></p>
        
        <hr>

        <!-- Profile Modal View (Hidden by default) -->
        <div id="profileModal" style="display: none; border: 2px solid orange; padding: 15px; margin-bottom: 20px; background: #1a1a1a;">
            <button onclick="closeProfile()">Close Profile</button>
            <h2 id="profileUsername"></h2>
            <p><strong>Followers:</strong> <span id="profileFollowersCount">Active</span> | <strong>Total Likes:</strong> <span id="profileLikesCount">0</span></p>
            <button id="profileFollowBtn" onclick="toggleProfileFollow()"></button>
            <h3>User's Posts:</h3>
            <div id="profilePostsFeed"></div>
            <hr>
        </div>

        <h2>Create a Post</h2>
        <form id="postForm" style="position: relative;">
            <textarea id="postInput" placeholder="What's on your mind? Use @username..." rows="3" cols="40" required style="max-width: 100%;"></textarea><br>
            <input type="file" id="postFileInput"><br>
            <button type="submit">Publish Post</button>
            <div id="postAutocomplete" style="border: 1px solid black; background: white; position: absolute; display: none; max-height: 100px; overflow-y: auto; width: 300px;"></div>
        </form>

        <h2>Feed</h2>
        <input type="text" id="searchInput" placeholder="Search posts by keyword or user..." style="width: 300px; max-width: 100%; margin-bottom: 10px;"><br>
        
        <!-- Filter Controls -->
        <div style="margin-bottom: 15px;">
            <label>Sort / Filter: 
                <select id="sortFilter">
                    <option value="newest">Newest</option>
                    <option value="oldest">Oldest</option>
                    <option value="popular">Most Popular</option>
                    <option value="liked">Liked Posts Only</option>
                </select>
            </label>
            &nbsp;&nbsp;
            <label><input type="checkbox" id="followingFilter"> Show Following Only</label>
        </div>

        <div id="postsFeed"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();
        let username = localStorage.getItem('jabber_username') || '';
        let knownUsers = [];
        let followingList = [];
        let allPosts = [];
        let userLikes = [];
        let viewingProfileUser = null;

        const mainSection = document.getElementById('main-section');
        const loginSection = document.getElementById('login-section');
        const displayUsername = document.getElementById('displayUsername');
        const logoutBtn = document.getElementById('logoutBtn');
        const postForm = document.getElementById('postForm');
        const postInput = document.getElementById('postInput');
        const postFileInput = document.getElementById('postFileInput');
        const postsFeed = document.getElementById('postsFeed');
        const postAutocomplete = document.getElementById('postAutocomplete');
        const searchInput = document.getElementById('searchInput');
        const followingFilter = document.getElementById('followingFilter');
        const sortFilter = document.getElementById('sortFilter');

        const profileModal = document.getElementById('profileModal');
        const profileUsername = document.getElementById('profileUsername');
        const profileFollowersCount = document.getElementById('profileFollowersCount');
        const profileLikesCount = document.getElementById('profileLikesCount');
        const profileFollowBtn = document.getElementById('profileFollowBtn');
        const profilePostsFeed = document.getElementById('profilePostsFeed');

        if (username) {
            displayUsername.textContent = username;
            loginSection.style.display = 'none';
            mainSection.style.display = 'block';
            socket.emit('register_user', username);
        }

        logoutBtn.addEventListener('click', () => {
            localStorage.removeItem('jabber_username');
            window.location.href = 'auth.html';
        });

        socket.on('update_user_list', (users) => {
            knownUsers = users;
        });

        socket.on('user_data', (data) => {
            if (data.username === username) {
                followingList = data.following || [];
                userLikes = data.likes || [];
                renderPostsFeed();
                if (viewingProfileUser) openProfile(viewingProfileUser);
            }
        });

        postInput.addEventListener('input', () => {
            const val = postInput.value;
            const cursorPos = postInput.selectionStart;
            const textBeforeCursor = val.substring(0, cursorPos);
            const lastAtIndex = textBeforeCursor.lastIndexOf('@');

            if (lastAtIndex !== -1) {
                const query = textBeforeCursor.substring(lastAtIndex + 1);
                if (!query.includes(' ')) {
                    const filtered = knownUsers.filter(u => u.toLowerCase().startsWith(query.toLowerCase()));
                    if (filtered.length > 0) {
                        postAutocomplete.innerHTML = '';
                        filtered.forEach(user => {
                            const div = document.createElement('div');
                            div.style.padding = '3px';
                            div.style.cursor = 'pointer';
                            div.textContent = '@' + user;
                            div.addEventListener('mousedown', (e) => {
                                e.preventDefault();
                                const beforeAt = val.substring(0, lastAtIndex);
                                const afterCursor = val.substring(cursorPos);
                                postInput.value = beforeAt + '@' + user + ' ' + afterCursor;
                                postAutocomplete.style.display = 'none';
                                postInput.focus();
                            });
                            postAutocomplete.appendChild(div);
                        });
                        postAutocomplete.style.display = 'block';
                        return;
                    }
                }
            }
            postAutocomplete.style.display = 'none';
        });

        searchInput.addEventListener('input', renderPostsFeed);
        followingFilter.addEventListener('change', renderPostsFeed);
        sortFilter.addEventListener('change', renderPostsFeed);

        socket.on('init_history', (data) => {
            allPosts = data.posts;
            renderPostsFeed();
            checkUrlForPost();
        });

        socket.on('new_post', (post) => {
            allPosts.unshift(post);
            renderPostsFeed();
        });

        socket.on('update_post', (updatedPost) => {
            const index = allPosts.findIndex(p => p.id === updatedPost.id);
            if (index !== -1) allPosts[index] = updatedPost;
            renderPostsFeed();
            if (viewingProfileUser) openProfile(viewingProfileUser);
        });

        postForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = postInput.value;
            const file = postFileInput.files[0];
            postAutocomplete.style.display = 'none';

            if (!text.trim() && !file) return;

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    socket.emit('create_post', { username, text, file: { name: file.name, type: file.type, data: event.target.result } });
                    postInput.value = '';
                    postFileInput.value = '';
                };
                reader.readAsDataURL(file);
            } else {
                socket.emit('create_post', { username, text, file: null });
                postInput.value = '';
            }
        });

        function checkUrlForPost() {
            const urlParams = new URLSearchParams(window.location.search);
            const postId = urlParams.get('p');
            if (postId) {
                setTimeout(() => {
                    const postElem = document.getElementById(postId);
                    if (postElem) {
                        postElem.scrollIntoView({ behavior: 'smooth' });
                        postElem.style.border = '3px solid #ff7700';
                    }
                }, 300);
            }
        }

        function renderPostsFeed() {
            postsFeed.innerHTML = '';
            const query = searchInput.value.toLowerCase();
            const onlyFollowing = followingFilter.checked;
            const sortMode = sortFilter.value;

            let filteredPosts = allPosts.filter(post => {
                const textMatch = post.text && post.text.toLowerCase().includes(query);
                const userMatch = post.username && post.username.toLowerCase().includes(query);
                const isFollowingMatch = !onlyFollowing || followingList.includes(post.username) || post.username === username;
                const isLikedMatch = sortMode !== 'liked' || userLikes.includes(post.id);
                return (textMatch || userMatch) && isFollowingMatch && isLikedMatch;
            });

            if (sortMode === 'oldest') {
                filteredPosts.sort((a, b) => (a.timestamp > b.timestamp ? 1 : -1));
            } else if (sortMode === 'popular') {
                filteredPosts.sort((a, b) => (b.likes || 0) - (a.likes || 0));
            } else {
                filteredPosts.sort((a, b) => (a.timestamp < b.timestamp ? 1 : -1));
            }

            filteredPosts.forEach(post => {
                const postWrapper = document.createElement('div');
                postWrapper.id = post.id;
                postWrapper.innerHTML = buildPostHTML(post);
                postsFeed.appendChild(postWrapper);
            });

            if (viewingProfileUser) {
                updateProfileModalContent(viewingProfileUser);
            }
        }

        function buildPostHTML(post) {
            const isMentioned = username && post.text.includes(`@${username}`);
            let highlightStyle = isMentioned ? 'background-color: #ffff99; border: 1px solid orange; padding: 10px; margin-bottom: 10px;' : 'border: 1px solid black; padding: 10px; margin-bottom: 10px;';
            const isFollowing = followingList.includes(post.username);
            const followBtnText = isFollowing ? 'Unfollow' : 'Follow';

            let mediaHTML = '';
            if (post.file) {
                if (post.file.type.startsWith('image/')) {
                    mediaHTML = `<br><img src="${post.file.data}" alt="${escapeHTML(post.file.name)}" style="max-width: 300px; display: block; margin-top: 5px;">`;
                } else {
                    mediaHTML = `<br><a href="${post.file.data}" download="${escapeHTML(post.file.name)}">📎 Download ${escapeHTML(post.file.name)}</a>`;
                }
            }

            let commentsHTML = '';
            if (post.comments) {
                post.comments.forEach((c, cIndex) => {
                    let repliesHTML = '';
                    if (c.replies) {
                        c.replies.forEach(r => {
                            repliesHTML += `<div style="margin-left: 20px; margin-top: 3px; border-left: 2px solid darkorange; padding-left: 5px;"><strong>${escapeHTML(r.username)}:</strong> ${escapeHTML(r.text)} <small>[${r.timestamp}]</small></div>`;
                        });
                    }
                    commentsHTML += `
                        <div style="margin-left: 15px; margin-top: 8px; border-left: 2px solid gray; padding-left: 5px;">
                            <strong>${escapeHTML(c.username)}:</strong> ${escapeHTML(c.text)} <small>[${c.timestamp}]</small>
                            <div style="margin-top: 3px;">${repliesHTML}</div>
                            <form onsubmit="submitReply(event, '${post.id}', ${cIndex}); return false;" style="margin-top: 4px;">
                                <input type="text" placeholder="Reply..." required style="font-size: 11px;">
                                <button type="submit" style="font-size: 10px;">Reply</button>
                            </form>
                        </div>`;
                });
            }

            let followButtonHTML = (username && post.username !== username) ? `<button onclick="toggleFollow('${escapeHTML(post.username)}')">${followBtnText}</button>` : '';

            return `
                <div style="${highlightStyle}">
                    <p><strong style="cursor: pointer; text-decoration: underline;" onclick="openProfile('${escapeHTML(post.username)}')">${escapeHTML(post.username)}</strong> ${followButtonHTML} <span style="float: right;">posted at ${post.timestamp}</span></p>
                    <p>${escapeHTML(post.text)}</p>
                    ${mediaHTML}
                    <br>
                    <button onclick="votePost('${post.id}', 'like')">👍 Like (${post.likes || 0})</button>
                    <button onclick="votePost('${post.id}', 'dislike')">👎 Dislike (${post.dislikes || 0})</button>
                    <button onclick="sharePost('${post.id}')">🔄 Share (${post.shares || 0})</button>
                    
                    <hr>
                    <strong>Comments:</strong>
                    <div style="margin-top: 5px;">${commentsHTML || '<p><small>No comments yet.</small></p>'}</div>
                    <form onsubmit="submitComment(event, '${post.id}'); return false;" style="margin-top: 5px;">
                        <input type="text" placeholder="Write a comment..." required>
                        <button type="submit">Comment</button>
                    </form>
                </div>
            `;
        }

        window.openProfile = function(targetUser) {
            viewingProfileUser = targetUser;
            profileModal.style.display = 'block';
            profileUsername.textContent = targetUser;
            updateProfileModalContent(targetUser);
        };

        window.closeProfile = function() {
            viewingProfileUser = null;
            profileModal.style.display = 'none';
        };

        function updateProfileModalContent(targetUser) {
            const userPosts = allPosts.filter(p => p.username === targetUser);
            let totalLikes = 0;
            userPosts.forEach(p => totalLikes += (p.likes || 0));
            profileLikesCount.textContent = totalLikes;

            if (username && targetUser !== username) {
                const isFollowing = followingList.includes(targetUser);
                profileFollowBtn.textContent = isFollowing ? 'Unfollow' : 'Follow';
                profileFollowBtn.style.display = 'inline-block';
            } else {
                profileFollowBtn.style.display = 'none';
            }

            profilePostsFeed.innerHTML = '';
            if (userPosts.length === 0) {
                profilePostsFeed.innerHTML = '<p><small>No posts found for this user.</small></p>';
            } else {
                userPosts.forEach(post => {
                    const div = document.createElement('div');
                    div.innerHTML = buildPostHTML(post);
                    profilePostsFeed.appendChild(div);
                });
            }
        }

        window.toggleProfileFollow = function() {
            if (viewingProfileUser) {
                toggleFollow(viewingProfileUser);
            }
        };

        window.votePost = function(postId, type) {
            if (!username) { alert('Please log in first!'); return; }
            socket.emit('vote_post', { postId, username, type });
        };

        window.sharePost = function(postId) {
            socket.emit('share_post', { postId });
            const shareUrl = `${window.location.origin}${window.location.pathname}?p=${postId}`;
            navigator.clipboard.writeText(shareUrl).then(() => {
                alert('Post link copied to clipboard: ' + shareUrl);
            }).catch(() => {
                prompt('Copy this link:', shareUrl);
            });
        };

        window.toggleFollow = function(targetUser) {
            if (!username) { alert('Please log in first!'); return; }
            socket.emit('toggle_follow', { follower: username, target: targetUser });
        };

        window.submitComment = function(e, postId) {
            e.preventDefault();
            if (!username) { alert('Please log in first!'); return; }
            const input = e.target.querySelector('input');
            const text = input.value.trim();
            if (text) {
                socket.emit('add_comment', { postId, username, text });
                input.value = '';
            }
        };

        window.submitReply = function(e, postId, commentIndex) {
            e.preventDefault();
            if (!username) { alert('Please log in first!'); return; }
            const input = e.target.querySelector('input');
            const text = input.value.trim();
            if (text) {
                socket.emit('add_reply', { postId, commentIndex, username, text });
                input.value = '';
            }
        };

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>

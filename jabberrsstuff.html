<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Jabberrs Stuff</title>
</head>
<body>

    <a href="index.html"><button>Back<--</button></a>

    <h1 style="font-family: 'Comic Sans MS', cursive, sans-serif;">Jabberrs Stuff:</h1>

    <!-- Username Section -->
    <div id="login-section">
        <label for="usernameInput">Enter your username:</label>
        <input type="text" id="usernameInput" placeholder="Username...">
        <button id="joinBtn">Set Username</button>
    </div>

    <!-- Main Content Section -->
    <div id="main-section" style="display: none;">
        <p>Logged in as: <strong id="displayUsername"></strong> <button id="changeNameBtn">Change</button></p>
        
        <hr>

        <h2>Create a Post</h2>
        <form id="postForm">
            <textarea id="postInput" placeholder="What's on your mind? Use @username..." rows="3" cols="40" required></textarea><br>
            <input type="file" id="postFileInput"><br>
            <button type="submit">Publish Post</button>
        </form>

        <h2>Posts Feed</h2>
        <div id="postsFeed"></div>
    </div>

    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const loginSection = document.getElementById('login-section');
        const mainSection = document.getElementById('main-section');
        const usernameInput = document.getElementById('usernameInput');
        const joinBtn = document.getElementById('joinBtn');
        const displayUsername = document.getElementById('displayUsername');
        const changeNameBtn = document.getElementById('changeNameBtn');
        
        const postForm = document.getElementById('postForm');
        const postInput = document.getElementById('postInput');
        const postFileInput = document.getElementById('postFileInput');
        const postsFeed = document.getElementById('postsFeed');

        let username = localStorage.getItem('jabber_username') || '';

        if (username) {
            displayUsername.textContent = username;
            loginSection.style.display = 'none';
            mainSection.style.display = 'block';
        }

        joinBtn.addEventListener('click', () => {
            const name = usernameInput.value.trim();
            if (name) {
                username = name;
                localStorage.setItem('jabber_username', username);
                displayUsername.textContent = username;
                loginSection.style.display = 'none';
                mainSection.style.display = 'block';
            } else {
                alert('Please enter a valid username.');
            }
        });

        changeNameBtn.addEventListener('click', () => {
            loginSection.style.display = 'block';
            mainSection.style.display = 'none';
            usernameInput.value = username;
        });

        usernameInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') joinBtn.click();
        });

        socket.on('init_history', (data) => {
            postsFeed.innerHTML = '';
            data.posts.forEach(post => renderPost(post, false));
        });

        socket.on('new_post', (post) => {
            renderPost(post, true);
        });

        socket.on('update_post', (updatedPost) => {
            const existingElement = document.getElementById(updatedPost.id);
            if (existingElement) {
                const tempDiv = document.createElement('div');
                tempDiv.innerHTML = buildPostHTML(updatedPost);
                existingElement.replaceWith(tempDiv.firstElementChild);
            }
        });

        postForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const text = postInput.value;
            const file = postFileInput.files[0];

            if (!text.trim() && !file) return;

            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    socket.emit('create_post', { username, text, file: { name: file.name, type: file.type, data: event.target.result } });
                    postInput.value = '';
                    postFileInput.value = '';
                };
                reader.readAsDataURL(file);
            } else {
                socket.emit('create_post', { username, text, file: null });
                postInput.value = '';
            }
        });

        function renderPost(post, isNew) {
            const postWrapper = document.createElement('div');
            postWrapper.id = post.id;
            postWrapper.innerHTML = buildPostHTML(post);
            postsFeed.prepend(postWrapper);
        }

        function buildPostHTML(post) {
            const isMentioned = username && post.text.includes(`@${username}`);
            let highlightStyle = isMentioned ? 'background-color: #ffff99; border: 1px solid orange; padding: 10px; margin-bottom: 10px;' : 'border: 1px solid black; padding: 10px; margin-bottom: 10px;';

            let mediaHTML = '';
            if (post.file) {
                if (post.file.type.startsWith('image/')) {
                    mediaHTML = `<br><img src="${post.file.data}" alt="${escapeHTML(post.file.name)}" style="max-width: 300px; display: block; margin-top: 5px;">`;
                } else {
                    mediaHTML = `<br><a href="${post.file.data}" download="${escapeHTML(post.file.name)}">📎 Download ${escapeHTML(post.file.name)}</a>`;
                }
            }

            let commentsHTML = '';
            if (post.comments) {
                post.comments.forEach(c => {
                    commentsHTML += `<div style="margin-left: 15px; margin-top: 5px; border-left: 2px solid gray; padding-left: 5px;"><strong>${escapeHTML(c.username)}:</strong> ${escapeHTML(c.text)} <small>[${c.timestamp}]</small></div>`;
                });
            }

            return `
                <div style="${highlightStyle}">
                    <p><strong>${escapeHTML(post.username)}</strong> posted at ${post.timestamp}</p>
                    <p>${escapeHTML(post.text)}</p>
                    ${mediaHTML}
                    <br><br>
                    <button onclick="votePost('${post.id}', 'like')">👍 Like (${post.likes})</button>
                    <button onclick="votePost('${post.id}', 'dislike')">👎 Dislike (${post.dislikes})</button>
                    
                    <hr>
                    <strong>Comments:</strong>
                    <div style="margin-top: 5px;">${commentsHTML || '<p><small>No comments yet.</small></p>'}</div>
                    <form onsubmit="submitComment(event, '${post.id}'); return false;" style="margin-top: 5px;">
                        <input type="text" placeholder="Write a comment..." required>
                        <button type="submit">Comment</button>
                    </form>
                </div>
            `;
        }

        window.votePost = function(postId, type) {
            if (!username) { alert('Please set your username first!'); return; }
            socket.emit('vote_post', { postId, username, type });
        };

        window.submitComment = function(e, postId) {
            e.preventDefault();
            if (!username) { alert('Please set your username first!'); return; }
            const input = e.target.querySelector('input');
            const text = input.value.trim();
            if (text) {
                socket.emit('add_comment', { postId, username, text });
                input.value = '';
            }
        };

        function escapeHTML(str) {
            if (!str) return '';
            return str.replace(/[&<>'"]/g, 
                tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag)
            );
        }
    </script>
</body>
</html>
